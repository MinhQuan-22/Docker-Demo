services:
  api:
    build: ./api
    container_name: topic5_api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-fullstack_demo}
      DB_USER: ${DB_USER:-fullstack_user}
      DB_PASSWORD: ${DB_PASSWORD:-fullstack_pass}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: topic5_db
    environment:
      POSTGRES_DB: ${DB_NAME:-fullstack_demo}
      POSTGRES_USER: ${DB_USER:-fullstack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fullstack_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fullstack_user -d fullstack_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
